name: Deploy to Production

on:
  push:
    branches:
      - main

  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  DEPLOY_PATH: /var/www/html/yudurobotics
  PM2_APP_NAME: yudurobotics
  NODE_VERSION: "20.18.1"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js app
        run: npm run build

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan \
            -H "${{ secrets.SSH_HOST }}" \
            >> ~/.ssh/known_hosts

      - name: Sync Next.js build
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            .next/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_PATH }}/.next/

      - name: Sync runtime files
        run: |
          rsync -avz \
            -e "ssh -i ~/.ssh/deploy_key" \
            public \
            package.json \
            package-lock.json \
            next.config.mjs \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.DEPLOY_PATH }}/

      - name: Install production dependencies and restart PM2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          timeout: 30m
          script: |
            cd ${{ env.DEPLOY_PATH }}
            npm ci --omit=dev --legacy-peer-deps
            pm2 restart ${{ env.PM2_APP_NAME }} --update-env
